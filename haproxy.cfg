global
    daemon
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    log global

# Write operations (master only)
listen postgres_write
    bind *:5432
    mode tcp
    balance first
    option tcp-check
    tcp-check connect
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    # Master (write operations)
    server master postgres-master:5432 maxconn 100 check port 5432

# Read operations (slaves)
listen postgres_read
    bind *:5433
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    # Slaves (read operations)
    server slave1 db-slave1:5432 maxconn 100 check port 5432
    server slave2 db-slave2:5432 maxconn 100 check port 5432

# Health check endpoint
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
