networks:
  default:
    name: care

services:
  db:
    image: postgres:alpine
    restart: unless-stopped
    env_file:
      - ./docker/.prebuilt.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./care-backups}:/backups
    ports:
      - "5433:5432"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - care-redis-data:/data
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ap-south-1 # To maintain compatibility with existing apps
    volumes:
      - "./care/media/minio:/data"
      - "./docker/minio/init-script.sh:/init-script.sh:ro" # Mount the init script
      - "./docker/minio/entrypoint.sh:/entrypoint.sh:ro" # Mount the entrypoint script
    ports:
      - "9100:9000" # S3 API
      - "9001:9001" # Web Console
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - default

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - default

volumes:
  postgres-data:
  care-redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
