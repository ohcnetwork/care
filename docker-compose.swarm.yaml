networks:
  default:
    name: care
    driver: overlay
    attachable: true

volumes:
  postgres-master-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-master
  postgres-slave1-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-slave1
  postgres-slave2-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-slave2
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/redis
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/minio

services:
  db:
    image: haproxy:alpine
    ports:
      - "5432:5432" # Write operations (master)
      - "5433:5433" # Read operations (slaves)
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-master:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgres-master-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-slave1:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
    volumes:
      - postgres-slave1-data:/var/lib/postgresql/data
      - ./postgres-slave-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-slave2:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
    volumes:
      - postgres-slave2-data:/var/lib/postgresql/data
      - ./postgres-slave-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --save 60 1 --save 300 100 --dir /data --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000" # MinIO API
      - "9101:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 384M
          cpus: "0.2"
        reservations:
          memory: 192M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "start.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    ports:
      - "9000:9000"
    deploy:
      replicas: 10
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 2
      update_config:
        failure_action: rollback
        parallelism: 2
        order: start-first
        delay: 15s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_worker.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 10
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 2
      update_config:
        failure_action: rollback
        parallelism: 2
        order: start-first
        delay: 15s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  celery-beat:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_beat.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 192M
          cpus: "0.25"
