networks:
  default:
    name: care
    driver: overlay

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # letsencrypt-data:

services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == data
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     memory: 4G
      #     cpus: '2.0'
      #   reservations:
      #     memory: 2G
      #     cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == data
      update_config:
        failure_action: rollback
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     memory: 2G
      #     cpus: '1.0'
      #   reservations:
      #     memory: 1G
      #     cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000" # MinIO API
      - "9101:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == data
      update_config:
        failure_action: rollback
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     memory: 2G
      #     cpus: '1.0'
      #   reservations:
      #     memory: 1G
      #     cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 60s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "start.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://postgres:postgres123@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://localhost:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin123
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == application
      update_config:
        parallelism: 1
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 2
      labels:
        - "traefik.enable=true"
        # HTTP router
        - "traefik.http.routers.backend.rule=Host(`care.localhost`)"
        - "traefik.http.routers.backend.entrypoints=web"
        - "traefik.http.routers.backend.service=backend"
        # HTTPS router
        # - "traefik.http.routers.backend-secure.rule=Host(`care.areeb.dev`)"
        # - "traefik.http.routers.backend-secure.entrypoints=websecure"
        # - "traefik.http.routers.backend-secure.service=backend"
        # - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
        - "traefik.http.services.backend.loadbalancer.server.port=9000"
      # resources:
      #   limits:
      #     memory: 2G
      #     cpus: '1.0'
      #   reservations:
      #     memory: 1G
      #     cpus: '0.5'
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3

  celery-worker:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_worker.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres123@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://localhost:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin123
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == application
      update_config:
        parallelism: 1
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 2
      # resources:
      #   limits:
      #     memory: 1G
      #     cpus: '1.0'
      #   reservations:
      #     memory: 512M
      #     cpus: '0.5'

  celery-beat:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_beat.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres123@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://localhost:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin123
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.tier == application
      update_config:
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 2
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: '1.0'
      #   reservations:
      #     memory: 256M
      #     cpus: '0.5'

  traefik:
    image: traefik:v3.4
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "8080:8080" # Traefik Dashboard
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=care
      - --entrypoints.web.address=:80
      # - --entrypoints.websecure.address=:443
      # Redirect HTTP to HTTPS
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      # - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt setup
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # - --certificatesresolvers.letsencrypt.acme.email=hi@areeb.dev
      # - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - letsencrypt-data:/letsencrypt
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 2
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: '0.5'
      #   reservations:
      #     memory: 256M
      #     cpus: '0.25'
