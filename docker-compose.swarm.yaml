networks:
  default:
    name: care
    driver: overlay
    attachable: true
    # ipam:
    #   config:
    #     - subnet: 10.20.0.0/24

volumes:
  postgres-master-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-master
  postgres-slave1-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-slave1
  postgres-slave2-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-slave2
  postgres-backup-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/postgres-backups
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/redis
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/minio
  portainer-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /care-storage/shared/portainer

configs:
  postgres-master:
    file: ./scripts/postgres_master.sh
  postgres-slave:
    file: ./scripts/postgres_slave.sh
  haproxy-config:
    file: ./haproxy.cfg

services:
  db:
    image: haproxy:alpine
    ports:
      - "5432:5432" # Write operations (master)
      - "5433:5433" # Read operations (slaves)
    configs:
      - source: haproxy-config
        target: /usr/local/etc/haproxy/haproxy.cfg
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 128M
      #     cpus: "0.2"
      #   reservations:
      #     memory: 64M
      #     cpus: "0.1"

  db-master:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
    configs:
      - source: postgres-master
        target: /docker-entrypoint-initdb.d/init.sh
        mode: 0755
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-slave1:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
      POSTGRES_MASTER_HOST: db-master
      POSTGRES_MASTER_PORT: 5432
    volumes:
      - postgres-slave1-data:/var/lib/postgresql/data
    configs:
      - source: postgres-slave
        target: /docker-entrypoint-initdb.d/init.sh
        mode: 0755
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-slave2:
    image: postgres:alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator
      POSTGRES_MASTER_HOST: db-master
      POSTGRES_MASTER_PORT: 5432
    volumes:
      - postgres-slave2-data:/var/lib/postgresql/data
    configs:
      - source: postgres-slave
        target: /docker-entrypoint-initdb.d/init.sh
        mode: 0755
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    entrypoint: >
      sh -c "
        until pg_isready -h db-master -p 5432 -U postgres; do
          sleep 2;
        done;
        /init.sh
      "
    environment:
      POSTGRES_HOST: db-master
      POSTGRES_PORT: 5432
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      TZ: "Asia/Kolkata"
    volumes:
      - postgres-backup-data:/backups
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     memory: 256M
      #     cpus: "0.2"
      #   reservations:
      #     memory: 128M
      #     cpus: "0.1"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --save 60 1 --save 300 100 --dir /data --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 384M
      #     cpus: "0.3"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000" # MinIO API
      - "9101:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    deploy:
      replicas: 1
      placement:
        # constraints:
        #   - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 30s
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 384M
      #     cpus: "0.3"
      #   reservations:
      #     memory: 192M
      #     cpus: "0.1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "start.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    ports:
      - "9000:9000"
    deploy:
      replicas: 10
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 2
      update_config:
        failure_action: rollback
        parallelism: 2
        order: start-first
        delay: 15s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.25"
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_worker.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 10
      placement:
        # constraints:
        #   - node.role == worker
        max_replicas_per_node: 2
      update_config:
        failure_action: rollback
        parallelism: 2
        order: start-first
        delay: 15s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 512M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 256M
      #     cpus: "0.25"

  celery-beat:
    image: ghcr.io/ohcnetwork/care:production-latest
    entrypoint: ["bash", "celery_beat.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/care
      POSTGRES_DB: care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_EXTERNAL_ENDPOINT: http://EC2_PUBLIC_IP:9100
      BUCKET_KEY: minioadmin
      BUCKET_SECRET: minioadmin
      FILE_UPLOAD_BUCKET: patient-bucket
      FACILITY_S3_BUCKET: facility-bucket
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        order: stop-first
        delay: 10s
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      # resources:
      #   limits:
      #     memory: 384M
      #     cpus: "0.5"
      #   reservations:
      #     memory: 192M
      #     cpus: "0.25"

  portainer-agent:
    image: portainer/agent:alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  portainer:
    image: portainer/portainer-ce:alpine
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    ports:
      - "9443:9443"
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     memory: 128M
      #     cpus: "0.3"
      #   reservations:
      #     memory: 64M
      #     cpus: "0.1"
