[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_voice"
version = "0.1.0"
description = "Real-time medical transcription plugin for CARE with AssemblyAI and LLM-powered SOAP notes"
requires-python = ">=3.13"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "assemblyai>=0.35.0",
    "openai>=1.50.0",
    "channels>=4.0.0",
    "channels-redis>=4.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["ai_voice*"]
