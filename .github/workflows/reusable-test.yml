name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    inputs:
      event_name:
        required: false
        type: string
        default: "pull_request"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute cache tag
        run: |
          echo "CACHE_TAG=buildcache-dev-$(date +%G-W%V)" >> "$GITHUB_ENV"

      - name: Resolve plugin cache buster
        id: plugin-hash
        run: |
          echo "resolved_hash=$(python3 .github/scripts/resolve_plugins.py)" >> "$GITHUB_OUTPUT"
        env:
          ADDITIONAL_PLUGS: ${{ env.ADDITIONAL_PLUGS }}

      - name: Build images
        run: |
          CACHE_TO=""
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            CACHE_TO="--cache-to=type=registry,ref=ghcr.io/${{ github.repository }}:$CACHE_TAG,mode=max"
          fi
          docker buildx build \
            --file docker/dev.Dockerfile \
            --tag care_local \
            --build-arg PLUGIN_RESOLVED_HASH=${{ steps.plugin-hash.outputs.resolved_hash }} \
            --build-arg ADDITIONAL_PLUGS=${{ env.ADDITIONAL_PLUGS }} \
            --cache-from=type=registry,ref=ghcr.io/${{ github.repository }}:$CACHE_TAG \
            $CACHE_TO \
            --platform linux/arm64 \
            --load \
            .

      - name: Start services
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --wait || \
          (docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs && exit 1)

      - name: Check missing migrations
        run: make checkmigration

      - name: Validate integrity of fixtures
        run: make load-fixtures

      - name: Dump db
        if: ${{ inputs.event_name == 'push' || github.event_name == 'push' }}
        run: make dump-db

      - name: Run tests
        run: make test-coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload dummy db as artifact so it can be used to speed up frontend tests
      - name: Dump db
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: make dump-db

      - name: Upload db artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: care-db-dump
          path: care_db.dump
          retention-days: 30
          compression-level: 0 # file is already compressed
